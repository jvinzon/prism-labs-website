<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Registrations | PRISM Labs Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .registrations-container {
      background: var(--white);
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 40px;
    }
    
    .registrations-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .registrations-table {
      width: 100%;
      border-collapse: collapse;
      overflow-x: auto;
      display: block;
    }
    
    .registrations-table thead {
      background: var(--light);
    }
    
    .registrations-table th,
    .registrations-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #E2E8F0;
    }
    
    .registrations-table th {
      font-weight: 600;
      color: var(--gray);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .registrations-table tr:hover {
      background: var(--light);
    }
    
    .registrations-table td {
      font-size: 0.95rem;
    }
    
    .action-buttons {
      display: flex;
      gap: 8px;
    }
    
    .btn-small {
      padding: 6px 12px;
      font-size: 0.875rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .btn-email {
      background: var(--blue);
      color: var(--white);
    }
    
    .btn-email:hover {
      background: #1D4ED8;
    }
    
    .btn-delete {
      background: var(--white);
      color: var(--red);
      border: 2px solid var(--red);
    }
    
    .btn-delete:hover {
      background: var(--red);
      color: var(--white);
    }
    
    .no-registrations {
      text-align: center;
      padding: 60px 0;
      color: var(--gray);
    }
    
    .filter-controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .filter-controls select,
    .filter-controls input {
      padding: 10px 16px;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    
    .export-buttons {
      display: flex;
      gap: 12px;
    }
    
    .btn-export {
      background: var(--white);
      color: var(--dark);
      border: 2px solid var(--gray);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .btn-export:hover {
      border-color: var(--dark);
      background: var(--dark);
      color: var(--white);
    }
    
    @media (max-width: 768px) {
      .registrations-table {
        font-size: 0.875rem;
      }
      
      .registrations-table th,
      .registrations-table td {
        padding: 12px 8px;
      }
      
      .action-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="admin-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="index.html" style="text-decoration: none; color: inherit;">
          <span class="admin-logo"><span class="gradient-text">PRISM</span> Labs Admin</span>
        </a>
      </div>
      <div class="nav-right">
        <span class="teacher-name" id="teacherNameDisplay">Mr. Vinzon</span>
        <button class="logout-btn" id="adminLogoutBtn">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="container">
      <section class="admin-welcome">
        <h1 class="admin-title">Student Registrations</h1>
        <p class="admin-subtitle">View, filter, and manage PRISM Labs member registrations</p>
      </section>

      <div class="registrations-container">
        <div class="registrations-header">
          <h2 style="font-size: 1.5rem;">All Registrations (<span id="totalCount">0</span>)</h2>
          <div class="export-buttons">
            <button class="btn-export" id="exportCSVBtn">📊 Export CSV</button>
            <button class="btn-export" id="printBtn">🖨️ Print</button>
          </div>
        </div>

        <div class="filter-controls">
          <select id="yearFilter">
            <option value="">All Year Levels</option>
            <option value="Year 9">Year 9</option>
            <option value="Year 10">Year 10</option>
            <option value="Year 11">Year 11</option>
            <option value="Year 12">Year 12</option>
            <option value="Year 13">Year 13</option>
          </select>
          <input type="text" id="searchInput" placeholder="🔍 Search by name or email...">
        </div>

        <div id="registrationsTableContainer">
          <p class="no-registrations">Loading registrations...</p>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="index.html" class="view-all-btn" style="background: var(--white); color: var(--dark); border: 2px solid var(--gray);">← Back to Dashboard</a>
      </div>
    </div>
  </main>

  <footer class="admin-footer">
    <div class="container">
      <p>&copy; 2026 PRISM Labs Admin Dashboard</p>
      <p class="footer-note">For teacher use only</p>
    </div>
  </footer>

  <script src="main.js"></script>
  <script>
    // Registration-specific JavaScript
    let allRegistrations = [];

    async function loadRegistrations() {
      try {
        const response = await fetch('registrations.json');
        const data = await response.json();
        allRegistrations = data.registrations || [];
        renderTable(allRegistrations);
      } catch (error) {
        document.getElementById('registrationsTableContainer').innerHTML = `
          <p class="no-registrations">No registrations found. Students register via the join form on the main site.</p>
        `;
        document.getElementById('totalCount').textContent = '0';
      }
    }

    function renderTable(registrations) {
      const container = document.getElementById('registrationsTableContainer');
      
      if (registrations.length === 0) {
        container.innerHTML = '<p class="no-registrations">No registrations match your filters</p>';
        document.getElementById('totalCount').textContent = '0';
        return;
      }

      document.getElementById('totalCount').textContent = registrations.length;

      container.innerHTML = `
        <table class="registrations-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Year Level</th>
              <th>Email</th>
              <th>Why Join</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${registrations.map(reg => `
              <tr>
                <td><strong>${reg.fullName}</strong></td>
                <td>${reg.yearLevel}</td>
                <td>${reg.email}</td>
                <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;" title="${reg.whyJoin}">${reg.whyJoin.substring(0, 80)}${reg.whyJoin.length > 80 ? '...' : ''}</td>
                <td>${formatDate(reg.submittedAt)}</td>
                <td>
                  <div class="action-buttons">
                    <button class="btn-small btn-email" onclick="emailStudent('${reg.email}', '${reg.fullName}')">📧 Email</button>
                    <button class="btn-small btn-delete" onclick="deleteRegistration('${reg.id}')">🗑️ Delete</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-NZ', { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function emailStudent(email, name) {
      const subject = encodeURIComponent('PRISM Labs Registration Confirmation');
      const body = encodeURIComponent(`Hi ${name},\n\nThank you for registering for PRISM Labs! \n\nPortal Access Code: prismlabs2026\nPortal URL: https://jvinzon.github.io/prism-labs-website/portal/\n\nSee you Thursday at 10:45 AM in Room 7!\n\nMr. Vinzon`);
      window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
    }

    async function deleteRegistration(id) {
      if (!confirm(`Delete registration for ${id}? This cannot be undone.`)) return;
      
      // In a real app, this would delete from server
      // For now, just show confirmation
      alert('Registration deleted (would be removed from server in production)');
      loadRegistrations();
    }

    // Filter functionality
    document.getElementById('yearFilter')?.addEventListener('change', applyFilters);
    document.getElementById('searchInput')?.addEventListener('input', applyFilters);

    function applyFilters() {
      const yearFilter = document.getElementById('yearFilter').value;
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allRegistrations.filter(reg => {
        const matchesYear = !yearFilter || reg.yearLevel === yearFilter;
        const matchesSearch = !searchTerm || 
          reg.fullName.toLowerCase().includes(searchTerm) || 
          reg.email.toLowerCase().includes(searchTerm);
        return matchesYear && matchesSearch;
      });

      renderTable(filtered);
    }

    // Export buttons
    document.getElementById('exportCSVBtn')?.addEventListener('click', () => {
      const csv = convertToCSV(allRegistrations);
      downloadFile(csv, 'prism-registrations.csv', 'text/csv');
    });

    document.getElementById('printBtn')?.addEventListener('click', () => {
      window.print();
    });

    function convertToCSV(registrations) {
      if (registrations.length === 0) return '';
      const headers = ['Name', 'Year Level', 'Email', 'Why Join', 'Submitted At'];
      const rows = registrations.map(r => [
        r.fullName,
        r.yearLevel,
        r.email,
        `"${r.whyJoin.replace(/"/g, '""')}"`,
        r.submittedAt
      ]);
      return [headers, ...rows].map(row => row.join(',')).join('\n');
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Load on page load
    loadRegistrations();
  </script>
</body>
</html>
