<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="nodeP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="nodeR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="nodeI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="nodeS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/><stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" fill="#F8FAFC"/>

  <!-- Circuit connections -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <line x1="150" y1="100" x2="300" y2="100"/>
    <line x1="300" y1="100" x2="450" y2="100"/>
    <line x1="150" y1="100" x2="150" y2="200"/>
    <line x1="300" y1="100" x2="300" y2="200"/>
    <line x1="450" y1="100" x2="450" y2="200"/>
    <line x1="150" y1="200" x2="300" y2="200"/>
    <line x1="300" y1="200" x2="450" y2="200"/>
  </g>

  <!-- Four track nodes -->
  <!-- P: Programming -->
  <circle cx="150" cy="100" r="32" fill="url(#nodeP)"/>
  <text x="150" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFF">P</text>

  <!-- R: Refurbishing -->
  <circle cx="300" cy="100" r="32" fill="url(#nodeR)"/>
  <text x="300" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFF">R</text>

  <!-- I: Innovation -->
  <circle cx="450" cy="100" r="32" fill="url(#nodeI)"/>
  <text x="450" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFF">I</text>

  <!-- S: Systems Management -->
  <circle cx="300" cy="200" r="32" fill="url(#nodeS)"/>
  <text x="300" y="200" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFF">S</text>

  <!-- Track labels -->
  <text x="150" y="150" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="1">PROGRAMMING</text>
  <text x="300" y="150" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="1">REFURBISHING</text>
  <text x="450" y="150" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="1">INNOVATION</text>
  <text x="300" y="250" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="1">SYSTEMS MGMT</text>

  <!-- Wordmark at bottom -->
  <text x="300" y="278" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#prismGrad)">PRISM</tspan><tspan fill="#1E293B"> Labs</tspan>
  </text>
</svg>