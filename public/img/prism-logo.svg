<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="25%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="75%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Prism Triangle -->
  <polygon points="50,10 90,80 10,80" fill="url(#prismGrad)" stroke="none"/>
  
  <!-- Light rays -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="50" x2="10" y2="80" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="50" x2="90" y2="80" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
